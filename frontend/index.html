<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Recovery Tracker - Client Management</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Invoice Recovery Tracker</h1>
            <p>Client Management System</p>
        </header>

        <main>
            <!-- Add Client Form -->
            <section class="card">
                <h2>Add New Client</h2>
                <form id="clientForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="client_name">Client Name *</label>
                            <input type="text" id="client_name" name="client_name" required>
                        </div>
                        <div class="form-group">
                            <label for="company_name">Company Name</label>
                            <input type="text" id="company_name" name="company_name">
                        </div>
                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city" name="city">
                        </div>
                        <div class="form-group">
                            <label for="contact_person">Contact Person</label>
                            <input type="text" id="contact_person" name="contact_person">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" name="phone">
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submitBtn">Add Client</button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn" style="display:none;">Cancel</button>
                    </div>
                </form>
                <div id="formMessage" class="message"></div>
            </section>

            <!-- Client List -->
            <section class="card">
                <div class="section-header">
                    <h2>Client List</h2>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search clients...">
                        <button class="btn btn-secondary" id="searchBtn">Search</button>
                    </div>
                </div>
                <div id="clientList" class="client-list">
                    <p class="loading">Loading clients...</p>
                </div>
                <div id="pagination" class="pagination"></div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Invoice Recovery Tracker</p>
        </footer>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <h3>Confirm Delete</h3>
            <p>Are you sure you want to delete this client? This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="btn btn-danger" id="confirmDelete">Delete</button>
                <button class="btn btn-secondary" id="cancelDelete">Cancel</button>
            </div>
        </div>
    </div>

    <script src="src/services/api.js"></script>
    <script src="src/app.js"></script>
</body>
</html>
