<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Recovery Tracker</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Invoice Recovery Tracker</h1>
            <p>Client & Case Management System</p>
        </header>

        <!-- Navigation Tabs -->
        <nav class="tabs">
            <button class="tab-btn active" data-tab="clients">👥 Clients</button>
            <button class="tab-btn" data-tab="cases">📄 Cases</button>
        </nav>

        <main>
            <!-- Clients Tab -->
            <div id="clients-tab" class="tab-content active">
                <!-- Add Client Form -->
                <section class="card">
                    <h2>Add New Client</h2>
                    <form id="clientForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="client_name">Client Name *</label>
                                <input type="text" id="client_name" name="client_name" required>
                            </div>
                            <div class="form-group">
                                <label for="company_name">Company Name</label>
                                <input type="text" id="company_name" name="company_name">
                            </div>
                            <div class="form-group">
                                <label for="city">City</label>
                                <input type="text" id="city" name="city">
                            </div>
                            <div class="form-group">
                                <label for="contact_person">Contact Person</label>
                                <input type="text" id="contact_person" name="contact_person">
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone</label>
                                <input type="tel" id="phone" name="phone">
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="submitClientBtn">Add Client</button>
                            <button type="button" class="btn btn-secondary" id="cancelClientBtn" style="display:none;">Cancel</button>
                        </div>
                    </form>
                    <div id="clientFormMessage" class="message"></div>
                </section>

                <!-- Client List -->
                <section class="card">
                    <div class="section-header">
                        <h2>Client List</h2>
                        <div class="search-box">
                            <input type="text" id="clientSearchInput" placeholder="Search clients...">
                            <button class="btn btn-secondary" id="clientSearchBtn">Search</button>
                        </div>
                    </div>
                    <div id="clientList" class="client-list">
                        <p class="loading">Loading clients...</p>
                    </div>
                    <div id="clientPagination" class="pagination"></div>
                </section>
            </div>

            <!-- Cases Tab -->
            <div id="cases-tab" class="tab-content">
                <!-- Add Case Form -->
                <section class="card">
                    <h2 id="caseFormTitle">Add New Case</h2>
                    <form id="caseForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="case_client_id">Client *</label>
                                <select id="case_client_id" name="client_id" required>
                                    <option value="">Select a client...</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="invoice_number">Invoice Number *</label>
                                <input type="text" id="invoice_number" name="invoice_number" required>
                            </div>
                            <div class="form-group">
                                <label for="invoice_amount">Invoice Amount *</label>
                                <input type="number" id="invoice_amount" name="invoice_amount" step="0.01" min="0.01" required>
                            </div>
                            <div class="form-group">
                                <label for="invoice_date">Invoice Date *</label>
                                <input type="date" id="invoice_date" name="invoice_date" required>
                            </div>
                            <div class="form-group">
                                <label for="due_date">Due Date *</label>
                                <input type="date" id="due_date" name="due_date" required>
                            </div>
                            <div class="form-group">
                                <label for="case_status">Status</label>
                                <select id="case_status" name="status">
                                    <option value="New">New</option>
                                    <option value="In Follow-up">In Follow-up</option>
                                    <option value="Partially Paid">Partially Paid</option>
                                    <option value="Closed">Closed</option>
                                </select>
                            </div>
                            <div class="form-group full-width">
                                <label for="last_follow_up_notes">Last Follow-up Notes</label>
                                <textarea id="last_follow_up_notes" name="last_follow_up_notes" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="submitCaseBtn">Add Case</button>
                            <button type="button" class="btn btn-secondary" id="cancelCaseBtn" style="display:none;">Cancel</button>
                        </div>
                    </form>
                    <div id="caseFormMessage" class="message"></div>
                </section>

                <!-- Case List -->
                <section class="card">
                    <div class="section-header">
                        <h2>Case List</h2>
                        <div class="filters">
                            <select id="statusFilter">
                                <option value="">All Status</option>
                                <option value="New">New</option>
                                <option value="In Follow-up">In Follow-up</option>
                                <option value="Partially Paid">Partially Paid</option>
                                <option value="Closed">Closed</option>
                            </select>
                            <select id="sortOrder">
                                <option value="asc">Due Date ↑</option>
                                <option value="desc">Due Date ↓</option>
                            </select>
                            <input type="text" id="caseSearchInput" placeholder="Search invoice #...">
                            <button class="btn btn-secondary" id="caseSearchBtn">Search</button>
                        </div>
                    </div>
                    <div id="caseList" class="case-list">
                        <p class="loading">Loading cases...</p>
                    </div>
                    <div id="casePagination" class="pagination"></div>
                </section>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Invoice Recovery Tracker</p>
        </footer>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <h3>Confirm Delete</h3>
            <p id="deleteModalText">Are you sure you want to delete this item? This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="btn btn-danger" id="confirmDelete">Delete</button>
                <button class="btn btn-secondary" id="cancelDelete">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Case Detail Modal -->
    <div id="caseDetailModal" class="modal">
        <div class="modal-content modal-large">
            <h3>Case Details</h3>
            <div id="caseDetailContent"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="closeCaseDetail">Close</button>
            </div>
        </div>
    </div>

    <script src="src/services/api.js"></script>
    <script src="src/app.js"></script>
</body>
</html>
